<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1a3a">
<meta name="apple-mobile-web-app-title" content="لقمة">
<title>لقمة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f4f9;--sf:#fff;--tx:#1a1726;--mu:#6c6880;--ac:#e0245e;--ac2:#ff7a45;--gd:#f2a900;--ln:#e6e3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#100e1a;--sf:#1b1830;--tx:#f3f1fa;--mu:#a09bb6;--ac:#ff4d79;--ac2:#ff9457;--gd:#ffc83d;--ln:#2e2a47;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans Arabic',system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto}.view.on{display:block}
#hdr{position:absolute;top:0;inset-inline:0;z-index:6;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
body[data-tab=reels] #hdr{background:linear-gradient(rgba(0,0,0,.6),transparent);border:0;color:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}
.mark{width:32px;height:32px}
#lg{display:flex;align-items:center;gap:6px;background:none;border:1px solid currentColor;border-radius:20px;color:inherit;padding:5px 12px;font:600 13px 'Noto Sans Arabic',sans-serif;cursor:pointer;opacity:.9}
#lg svg{width:18px;height:18px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;padding:8px 0 6px;background:none;border:0;color:var(--mu);font:600 11px 'Noto Sans Arabic',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#reels{scroll-snap-type:y mandatory;background:#000}
#reels .empty{color:#fff;padding:120px 24px;text-align:center}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.reel video,.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.8))}
.info{position:relative;padding:16px 16px 24px;width:calc(100% - 76px)}
.usr{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border-radius:20px;padding:5px 12px;font-weight:600;font-size:14px}
.pill svg{width:15px;height:15px}
.info p{font-size:14px;margin-top:8px;line-height:1.7}
.side{position:absolute;inset-inline-end:10px;bottom:28px;display:flex;flex-direction:column;gap:18px;align-items:center}
.side button{background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:50%;width:50px;height:50px;display:grid;place-items:center;cursor:pointer}
.side button.liked{color:var(--ac)}.side svg{width:26px;height:26px}
.side small{display:block;font-size:12px;text-align:center;margin-top:3px;font-weight:600}
.pad{padding:72px 16px 24px}
h1{font-size:24px;font-weight:800;margin-bottom:12px}
input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:400 16px 'Noto Sans Arabic',sans-serif;margin-top:8px}
.chips{display:flex;gap:8px;margin:14px 0;overflow-x:auto;padding-bottom:2px}
.chip{padding:8px 16px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 14px 'Noto Sans Arabic',sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.seg{display:flex;gap:8px;margin-top:10px}.seg .chip{flex:1;text-align:center}
.place{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:10px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;cursor:pointer}
.tile{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none}
.place b{display:block;font-size:16px;margin-bottom:2px}
small,.mu{color:var(--mu)}.mu{margin:8px 0;line-height:1.7}
.stars{color:var(--gd);letter-spacing:1px}
.badge{display:inline-block;background:var(--ln);color:var(--mu);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:600}
.vbadge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:11px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
.stat{display:flex;gap:10px;margin:14px 0}
.stat div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:14px;padding:14px;font:700 16px 'Noto Sans Arabic',sans-serif;width:100%;cursor:pointer;margin-top:14px}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}.btn:disabled{opacity:.6}
a.btn{display:block;text-align:center;text-decoration:none}
.hero{height:130px;border-radius:20px;display:grid;place-items:center;font-size:60px;margin:12px 0}
.rev{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.rev p{margin-top:4px;line-height:1.7}
label{display:block;font-weight:700;margin-top:16px}
.rate{display:flex;gap:6px;margin-top:8px}.rate button{background:none;border:0;font-size:34px;color:var(--ln);cursor:pointer;padding:0}.rate .f{color:var(--gd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.box{background:var(--sf);width:100%;max-height:85%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.box h2{font-size:20px;margin-bottom:6px}.err{color:var(--ac);margin-top:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;z-index:30}
a{color:var(--ac);font-weight:700}
</style></head><body data-tab="reels">

<header id="hdr"></header>

<section class="view" id="me"><div class="pad" id="mBody"></div></section>
</main><nav id="nav"></nav></div>

function login(mode='in',cb,pre){
 const up=mode==='up';let type=pre||'user';
 const m=sheet(`<h2>${up?t('signup'):t('login')}</h2><p class="mu">${t('guest_note')}</p>${up?`<div class="seg"><button type="button" class="chip ${type==='user'?'on':''}" data-t="user">${t('acct_user')}</button><button type="button" class="chip ${type==='venue'?'on':''}" data-t="venue">${t('acct_venue')}</button></div><input id="nm" placeholder="${t(type==='venue'?'venue_name':'name')}">`:''}<input id="em" type="email" dir="ltr" placeholder="${t('email')}"><input id="pw" type="password" dir="ltr" placeholder="${t('pass_ph')}"><p class="err" id="er"></p><button class="btn" id="go">${up?t('create'):t('enter')}</button><button class="btn ghost" id="sw">${up?t('have_acc'):t('no_acc')}</button>`);
 const q=s=>m.querySelector(s);
 if(up)m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;m.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));q('#nm').placeholder=t(type==='venue'?'venue_name':'name')});
 q('#sw').onclick=()=>{m.remove();login(up?'in':'up',cb,type)};
 q('#go').onclick=async()=>{
  const email=q('#em').value.trim(),password=q('#pw').value;
  if(!email||password.length<6){q('#er').textContent=t('need_valid');return}
  q('#go').disabled=true;
  const r=up?await sb.auth.signUp({email,password,options:{data:{name:q('#nm').value.trim()||t('guest'),role:type}}}):await sb.auth.signInWithPassword({email,password});
  q('#go').disabled=false;

  m.remove();toast(t('welcome'));cb&&cb()};
}

/* reels */
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{root:$('#reels'),threshold:.7});
function paint(r){const a=document.querySelector(`.reel[data-id="${r.id}"]`);if(!a)return;const b=a.querySelector('[data-a=like]');b.innerHTML=ic('heart',r.mine);b.classList.toggle('liked',r.mine);a.querySelector('.ln').textContent=r.n;a.querySelector('.cn').textContent=r.c}
async function loadReels(){
 const el=$('#reels');io.disconnect();el.innerHTML=`<p class="empty">${t('loading')}</p>`;
 const {data,error}=await sb.from('reels').select('id,caption,media_url,places!place_id(name,verified),profiles!user_id(display_name)').order('created_at',{ascending:false}).limit(30);
 if(error){el.innerHTML=`<p class="empty">${t('load_fail')}${esc(error.message)}</p>`;return}
 if(!data.length){el.innerHTML=`<p class="empty">${t('no_reels')}</p>`;return}
 const ids=data.map(r=>r.id);
 const [l,c]=await Promise.all([sb.from('likes').select('reel_id,user_id').in('reel_id',ids),sb.from('comments').select('reel_id').in('reel_id',ids)]);
 reelsData=data.map(r=>({...r,n:(l.data||[]).filter(x=>x.reel_id===r.id).length,mine:!!user&&(l.data||[]).some(x=>x.reel_id===r.id&&x.user_id===user.id),c:(c.data||[]).filter(x=>x.reel_id===r.id).length}));
 el.innerHTML=reelsData.map(r=>{const nm=r.profiles?.display_name||t('guest');return `<article class="reel" data-id="${r.id}">${isVid(r.media_url)?`<video src="${esc(r.media_url)}" muted loop playsinline preload="metadata"></video>`:`<img src="${esc(r.media_url)}" alt="">`}<div class="shade"></div><div class="info"><div class="usr">${av(nm)}<span>${esc(nm)}</span></div><span class="pill">${ic('pin')}${esc(r.places?.name)}${vb(r.places)}</span><p>${esc(r.caption)}</p></div><div class="side"><div><button data-a="like" aria-label="like"></button><small class="ln">0</small></div><div><button data-a="cm" aria-label="${t('comments')}">${ic('msg')}</button><small class="cn">0</small></div></div></article>`}).join('');
 reelsData.forEach(paint);el.querySelectorAll('.reel').forEach(a=>io.observe(a));
}
$('#reels').addEventListener('click',async e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const r=reelsData.find(x=>x.id===b.closest('.reel').dataset.id);
 if(b.dataset.a==='cm')return comments(r);
 if(!user)return login();
 if(r.mine){r.mine=false;r.n--;paint(r);await sb.from('likes').delete().match({user_id:user.id,reel_id:r.id})}
 else{r.mine=true;r.n++;paint(r);await sb.from('likes').insert({user_id:user.id,reel_id:r.id})}
});
async function comments(r){
 const m=sheet('');const box=m.firstChild;
 const draw=async()=>{
  const {data}=await sb.from('comments').select('body,profiles!user_id(display_name)').eq('reel_id',r.id).order('created_at');
  box.innerHTML=`<h2>${t('comments')}</h2>${(data||[]).map(c=>{const n=c.profiles?.display_name||t('guest');return `<div class="rev">${av(n)}<div><b>${esc(n)}</b><p>${esc(c.body)}</p></div></div>`}).join('')||`<p class="mu">${t('first_comment')}</p>`}<input id="ct" maxlength="500" placeholder="${t('comment_ph')}"><button class="btn" id="cs">${t('send')}</button>`;
  box.querySelector('#cs').onclick=async()=>{
   const x=box.querySelector('#ct').value.trim();if(!x)return;
   if(!user){m.remove();login('in',()=>comments(r));return}
   const {error}=await sb.from('comments').insert({user_id:user.id,reel_id:r.id,body:x});
   if(error){toast(t('send_fail'));return}
   r.c++;paint(r);draw()};
 };draw();
}

/* discover */
let q='',cat='';
function renderDiscover(){
 $('#dBody').innerHTML=`<h1>${t('discover')}</h1><input id="q" placeholder="${t('search_ph')}" value="${esc(q)}"><div class="chips">${[['',t('all')],['restaurant',t('c_restaurant')],['cafe',t('c_cafe')],['fast_food',t('c_fast_food')],['dessert',t('c_dessert')]].map(([v,n])=>`<button class="chip ${v===cat?'on':''}" data-c="${v}">${n}</button>`).join('')}</div><div id="list"></div>`;

async function list(){
 const box=$('#list');box.innerHTML=`<p class="mu">${t('searching')}</p>`;
 let s=sb.from('places').select('id,name,address,category,verified').order('verified',{ascending:false}).order('name').limit(40);
 if(q)s=s.ilike('name','%'+q.replace(/[%,]/g,' ')+'%');
 if(cat)s=s.eq('category',cat);
 const {data,error}=await s;
 if(error){box.innerHTML=`<p class="mu">${t('load_fail')}${esc(error.message)}</p>`;return}
 if(!data.length){box.innerHTML=`<p class="mu">${q||cat?t('no_results'):t('no_places')}</p>${!q&&!cat&&!user?`<button class="btn" id="rv">${t('register_venue')}</button>`:''}`;const b=$('#rv');if(b)b.onclick=()=>login('up',null,'venue');return}
 const rv=await sb.from('reviews').select('place_id,rating').in('place_id',data.map(p=>p.id));
 box.innerHTML=data.map(p=>{const a=(rv.data||[]).filter(x=>x.place_id===p.id);const avg=a.length?a.reduce((s,x)=>s+x.rating,0)/a.length:0;
  return `<div class="place" tabindex="0" data-id="${p.id}"><div class="tile" style="background:${gr(p.category)}">${EM[p.category]||'🍴'}</div><div><b>${esc(p.name)}${vb(p)}</b>${a.length?`<span class="stars">${stars(avg)}</span> <small>${avg.toFixed(1)} (${a.length})</small>`:`<small>${t('unrated')}</small>`}<br><small>${esc(p.address||t('baghdad'))}</small></div></div>`}).join('');
 box.querySelectorAll('.place').forEach(d=>d.onclick=()=>detail(d.dataset.id));

async function detail(id){
 const [{data:p},{data:rv}]=await Promise.all([sb.from('places').select('*').eq('id',id).single(),sb.from('reviews').select('rating,body,profiles!user_id(display_name)').eq('place_id',id).order('created_at',{ascending:false})]);
 if(!p)return;
 const avg=rv?.length?rv.reduce((s,x)=>s+x.rating,0)/rv.length:0;let rating=0;
 const own=!!user&&p.owner_id===user.id;
 $('#dBody').innerHTML=`<button class="chip" id="back">${t('back')}</button><div class="hero" style="background:${gr(p.category)}">${EM[p.category]||'🍴'}</div><h1>${esc(p.name)}${vb(p)}</h1><div>${rv?.length?`<span class="stars">${stars(avg)}</span> <small>${avg.toFixed(1)} (${rv.length} ${t('reviews_n')})</small>`:`<small>${t('first_rate')}</small>`}</div><p class="mu">${esc(p.address||t('baghdad'))}</p>${p.description?`<p class="mu">${esc(p.description)}</p>`:''}<p><a href="${mapUrl(p)}" target="_blank" rel="noopener">${t('open_map')}</a>${p.phone?` &nbsp; <a href="tel:${esc(p.phone)}">${t('call')}</a>`:''}</p>
 ${own?`<p class="mu">${t('own_note')}</p>`:`<label>${t('add_review')}</label><div class="rate" id="rate"></div><textarea id="rt" rows="3" maxlength="1000" placeholder="${t('review_ph')}"></textarea><button class="btn" id="send">${t('send_review')}</button>`}
 <div style="margin-top:20px">${(rv||[]).map(v=>{const n=v.profiles?.display_name||t('guest');return `<div class="rev">${av(n)}<div><b>${esc(n)}</b> <span class="stars">${stars(v.rating)}</span><p>${esc(v.body)}</p></div></div>`}).join('')}</div>`;
 $('#back').onclick=renderDiscover;
 if(!own){rateWidget($('#rate'),v=>rating=v);
 $('#send').onclick=async()=>{
  if(!user)return login('in');
  if(!rating){toast(t('pick_rating'));return}
  const {error}=await sb.from('reviews').upsert({user_id:user.id,place_id:id,rating,body:$('#rt').value.trim()},{onConflict:'user_id,place_id'});
  if(error){toast(t('send_fail'));return}
  toast(t('rev_posted'));detail(id)}}
}

/* post */
function renderPost(){
 const b=$('#pBody');
 if(!user){b.innerHTML=`<h1>${t('post_title')}</h1><p class="mu">${t('need_login')}</p><button class="btn" id="lg2">${t('login')}</button>`;$('#lg2').onclick=()=>login('in');return}
 if(isV()&&!myPlace){b.innerHTML=`<h1>${t('post_title')}</h1><button class="btn" id="sp">${t('setup_title')}</button>`;$('#sp').onclick=venueForm;return}
 let rating=0;const v=isV();
 b.innerHTML=`<h1>${t('post_title')}</h1>${v?`<p class="mu"><b>${esc(myPlace.name)}</b>${vb(myPlace)}</p>`:`<label>${t('place')}</label><input id="ps" placeholder="${t('place_ph')}"><select id="pl" size="4"></select>`}
 <label>${t('file_lbl')}</label><input type="file" id="fl" accept="video/*,image/*">${v?'':`<label>${t('rating_opt')}</label><div class="rate" id="rate"></div>`}
 <label>${t('caption')}</label><textarea id="cp" rows="3" maxlength="500" placeholder="${t('caption_ph')}"></textarea><button class="btn" id="pub">${t('publish')}</button>`;
 if(!v){rateWidget($('#rate'),x=>rating=x);
 $('#ps').oninput=debounce(async e=>{
  const x=e.target.value.trim();if(x.length<2)return;
  const {data}=await sb.from('places').select('id,name,address').ilike('name','%'+x.replace(/[%,]/g,' ')+'%').limit(20);
  $('#pl').innerHTML=(data||[]).map(p=>`<option value="${p.id}">${esc(p.name)} - ${esc(p.address||'')}</option>`).join('')})}
 $('#pub').onclick=async()=>{
  const f=$('#fl').files[0],pid=v?myPlace.id:$('#pl').value;
  if(!pid||!f){toast(t('pick_both'));return}
  if(f.size>52428800){toast(t('too_big'));return}
  const btn=$('#pub');btn.disabled=true;btn.textContent=t('uploading');
  const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${user.id}/${Date.now()}.${ext}`;
  const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});
  if(up.error){toast(t('up_fail')+up.error.message);btn.disabled=false;btn.textContent=t('publish');return}
  const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  const ins=await sb.from('reels').insert({user_id:user.id,place_id:pid,caption:$('#cp').value.trim(),media_url:url});
  if(ins.error){toast(t('post_fail')+ins.error.message);btn.disabled=false;btn.textContent=t('publish');return}
  if(!v&&rating)await sb.from('reviews').upsert({user_id:user.id,place_id:pid,rating,body:$('#cp').value.trim()},{onConflict:'user_id,place_id'});
  toast(t('posted'));show('reels')};
}
