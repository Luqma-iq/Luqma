<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لقمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f3fa;--sf:#fff;--tx:#1c1830;--mu:#6b6682;--ac:#d6244f;--gd:#e8a200;--ln:#e2dded;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--sf:#201c33;--tx:#f4f2fa;--mu:#a29db8;--ac:#ff4d6d;--gd:#ffc94d;--ln:#322d4a;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow-y:auto}.view.on{display:block}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;padding:9px 0 7px;background:none;border:0;color:var(--mu);font:700 12px Tajawal,sans-serif;cursor:pointer}
nav button span{display:block;font-size:21px}nav button.on{color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#reels{scroll-snap-type:y mandatory;background:#000}
#reels .empty{color:#fff;padding:40px 20px;text-align:center}
.reel{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.reel video,.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.75))}
.info{position:relative;padding:16px 16px 22px;width:calc(100% - 70px)}
.info h3{font-size:20px;font-weight:800}.info p{font-size:14px;margin-top:6px;line-height:1.6}.usr{font-size:13px;opacity:.85;margin-bottom:4px}
.side{position:absolute;left:10px;bottom:24px;display:flex;flex-direction:column;gap:16px;align-items:center}
.side button{background:rgba(0,0,0,.4);border:0;color:#fff;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer}
.side small{display:block;font-size:12px;text-align:center;margin-top:2px}
.pad{padding:16px}h1{font-size:26px;font-weight:800;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:400 16px Tajawal,sans-serif;margin-top:8px}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:700 14px Tajawal,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.place{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.em{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--sf);border:1px solid var(--ln)}
.place b{display:block;font-size:17px}small,.mu{color:var(--mu)}.mu{margin:8px 0}
.stars{color:var(--gd);letter-spacing:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;font:800 16px Tajawal,sans-serif;width:100%;cursor:pointer;margin-top:14px}
.btn.ghost{background:none;color:var(--ac);border:1px solid var(--ac)}.btn:disabled{opacity:.6}
.rev{padding:12px 0;border-bottom:1px solid var(--ln)}
label{display:block;font-weight:700;margin-top:14px}
.rate{display:flex;gap:6px;margin-top:8px}.rate button{background:none;border:0;font-size:32px;color:var(--ln);cursor:pointer;padding:0}.rate .f{color:var(--gd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.box{background:var(--sf);width:100%;max-height:80%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.box h2{font-size:20px;margin-bottom:6px}.err{color:var(--ac);margin-top:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:700;z-index:30}
a{color:var(--ac);font-weight:700}
</style></head><body>
<div id="app"><main>
<section class="view on" id="reels"></section>
<section class="view" id="discover"><div class="pad" id="dBody"></div></section>
<section class="view" id="post"><div class="pad" id="pBody"></div></section>
<section class="view" id="me"><div class="pad" id="mBody"></div></section>
</main>
<nav><button class="on" data-v="reels"><span>🎬</span>ريلز</button><button data-v="discover"><span>🔎</span>اكتشف</button><button data-v="post"><span>➕</span>انشر</button><button data-v="me"><span>👤</span>حسابي</button></nav></div>
<script>
const sb=supabase.createClient('https://ametfnpidphdczoqjsqw.supabase.co','sb_publishable_qINjSvkNtkbULN4ahmWuCg_VawdEqsH');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>{n=Math.round(n)||0;return '★'.repeat(n)+'☆'.repeat(5-n)};
const isVid=u=>/\.(mp4|mov|webm|m4v)(\?|$)/i.test(u||'');
const EM={restaurant:'🍽️',cafe:'☕',fast_food:'🍔'};
let user=null,tab='reels',reelsData=[];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function sheet(h){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box"></div>';m.firstChild.innerHTML=h;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function rateWidget(el,set){el.innerHTML=[1,2,3,4,5].map(i=>`<button type="button" data-r="${i}" aria-label="${i}">★</button>`).join('');el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=+b.dataset.r;set(v);el.querySelectorAll('button').forEach(x=>x.classList.toggle('f',+x.dataset.r<=v))}}
const uname=u=>u?.user_metadata?.name||'مستخدم';
const debounce=(f,ms=350)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}};

/* auth */
function login(mode='in',cb){
 const up=mode==='up';
 const m=sheet(`<h2>${up?'حساب جديد':'تسجيل الدخول'}</h2><p class="mu">المشاهدة بدون حساب. الحساب للنشر والتعليق والتقييم.</p>${up?'<input id="nm" placeholder="اسمك">':''}<input id="em" type="email" dir="ltr" placeholder="الإيميل"><input id="pw" type="password" dir="ltr" placeholder="كلمة السر (6 أحرف على الأقل)"><p class="err" id="er"></p><button class="btn" id="go">${up?'إنشاء حساب':'دخول'}</button><button class="btn ghost" id="sw">${up?'عندي حساب':'ما عندي حساب'}</button>`);
 const q=s=>m.querySelector(s);
 q('#sw').onclick=()=>{m.remove();login(up?'in':'up',cb)};
 q('#go').onclick=async()=>{
  const email=q('#em').value.trim(),password=q('#pw').value;
  if(!email||password.length<6){q('#er').textContent='اكتب إيميل وكلمة سر من 6 أحرف أو أكثر';return}
  q('#go').disabled=true;
  const r=up?await sb.auth.signUp({email,password,options:{data:{name:q('#nm').value.trim()||'مستخدم'}}}):await sb.auth.signInWithPassword({email,password});
  q('#go').disabled=false;
  if(r.error){q('#er').textContent=r.error.message;return}
  if(!r.data.session){m.remove();toast('تحقق من إيميلك لتأكيد الحساب');return}
  m.remove();toast('أهلاً بك');cb&&cb()};
}
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(tab==='me')renderMe();if(tab==='post')renderPost()});

/* reels */
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{root:$('#reels'),threshold:.7});
function paint(r){const a=document.querySelector(`.reel[data-id="${r.id}"]`);if(!a)return;a.querySelector('[data-a=like]').textContent=r.mine?'❤️':'🤍';a.querySelector('.ln').textContent=r.n;a.querySelector('.cn').textContent=r.c}
async function loadReels(){
 const el=$('#reels');io.disconnect();el.innerHTML='<p class="empty">جاري التحميل…</p>';
 const {data,error}=await sb.from('reels').select('id,caption,media_url,places(name),profiles(display_name)').order('created_at',{ascending:false}).limit(30);
 if(error){el.innerHTML=`<p class="empty">تعذر التحميل: ${esc(error.message)}</p>`;return}
 if(!data.length){el.innerHTML='<p class="empty">ما كو ريلات بعد. كن أول من ينشر!</p>';return}
 const ids=data.map(r=>r.id);
 const [l,c]=await Promise.all([sb.from('likes').select('reel_id,user_id').in('reel_id',ids),sb.from('comments').select('reel_id').in('reel_id',ids)]);
 reelsData=data.map(r=>({...r,n:(l.data||[]).filter(x=>x.reel_id===r.id).length,mine:!!user&&(l.data||[]).some(x=>x.reel_id===r.id&&x.user_id===user.id),c:(c.data||[]).filter(x=>x.reel_id===r.id).length}));
 el.innerHTML=reelsData.map(r=>`<article class="reel" data-id="${r.id}">${isVid(r.media_url)?`<video src="${esc(r.media_url)}" muted loop playsinline preload="metadata"></video>`:`<img src="${esc(r.media_url)}" alt="">`}<div class="shade"></div><div class="info"><div class="usr">@${esc(r.profiles?.display_name||'مستخدم')}</div><h3>${esc(r.places?.name)}</h3><p>${esc(r.caption)}</p></div><div class="side"><div><button data-a="like" aria-label="إعجاب">🤍</button><small class="ln">0</small></div><div><button data-a="cm" aria-label="تعليقات">💬</button><small class="cn">0</small></div></div></article>`).join('');
 reelsData.forEach(paint);el.querySelectorAll('.reel').forEach(a=>io.observe(a));
}
$('#reels').addEventListener('click',async e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const r=reelsData.find(x=>x.id===b.closest('.reel').dataset.id);
 if(b.dataset.a==='cm')return comments(r);
 if(!user)return login();
 if(r.mine){r.mine=false;r.n--;paint(r);await sb.from('likes').delete().match({user_id:user.id,reel_id:r.id})}
 else{r.mine=true;r.n++;paint(r);await sb.from('likes').insert({user_id:user.id,reel_id:r.id})}
});
async function comments(r){
 const m=sheet('');const box=m.firstChild;
 const draw=async()=>{
  const {data}=await sb.from('comments').select('body,profiles(display_name)').eq('reel_id',r.id).order('created_at');
  box.innerHTML=`<h2>التعليقات</h2>${(data||[]).map(c=>`<div class="rev"><b>${esc(c.profiles?.display_name||'مستخدم')}</b><p>${esc(c.body)}</p></div>`).join('')||'<p class="mu">كن أول من يعلّق.</p>'}<input id="ct" maxlength="500" placeholder="اكتب تعليقك"><button class="btn" id="cs">أرسل</button>`;
  box.querySelector('#cs').onclick=async()=>{
   const t=box.querySelector('#ct').value.trim();if(!t)return;
   if(!user){m.remove();login('in',()=>comments(r));return}
   const {error}=await sb.from('comments').insert({user_id:user.id,reel_id:r.id,body:t});
   if(error){toast('تعذر الإرسال');return}
   r.c++;paint(r);draw()};
 };draw();
}

/* discover */
let q='',cat='';
function renderDiscover(){
 $('#dBody').innerHTML=`<h1>اكتشف</h1><input id="q" placeholder="ابحث عن مطعم أو كافيه" value="${esc(q)}"><div class="chips">${[['','الكل'],['restaurant','مطاعم'],['cafe','كافيهات'],['fast_food','وجبات سريعة']].map(([v,t])=>`<button class="chip ${v===cat?'on':''}" data-c="${v}">${t}</button>`).join('')}</div><div id="list"></div>`;
 $('#q').oninput=debounce(e=>{q=e.target.value.trim();list()});
 $('#dBody').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderDiscover()});
 list();
}
async function list(){
 const box=$('#list');box.innerHTML='<p class="mu">جاري البحث…</p>';
 let s=sb.from('places').select('id,name,address,category').order('name').limit(40);
 if(q)s=s.ilike('name','%'+q.replace(/[%,]/g,' ')+'%');
 if(cat)s=s.eq('category',cat);
 const {data,error}=await s;
 if(error){box.innerHTML=`<p class="mu">تعذر التحميل: ${esc(error.message)}</p>`;return}
 if(!data.length){box.innerHTML='<p class="mu">ما لكينا نتائج. جرب كلمة ثانية.</p>';return}
 const rv=await sb.from('reviews').select('place_id,rating').in('place_id',data.map(p=>p.id));
 box.innerHTML=data.map(p=>{const a=(rv.data||[]).filter(x=>x.place_id===p.id);const avg=a.length?a.reduce((t,x)=>t+x.rating,0)/a.length:0;
  return `<div class="place" tabindex="0" data-id="${p.id}"><div class="em">${EM[p.category]||'🍴'}</div><div><b>${esc(p.name)}</b>${a.length?`<span class="stars">${stars(avg)}</span> <small>${avg.toFixed(1)} (${a.length})</small>`:'<small>بدون تقييم بعد</small>'}<br><small>${esc(p.address||'بغداد')}</small></div></div>`}).join('');
 box.querySelectorAll('.place').forEach(d=>d.onclick=()=>detail(d.dataset.id));
}
async function detail(id){
 const [{data:p},{data:rv}]=await Promise.all([sb.from('places').select('*').eq('id',id).single(),sb.from('reviews').select('rating,body,profiles(display_name)').eq('place_id',id).order('created_at',{ascending:false})]);
 if(!p)return;
 const avg=rv?.length?rv.reduce((t,x)=>t+x.rating,0)/rv.length:0;let rating=0;
 $('#dBody').innerHTML=`<button class="chip" id="back">رجوع</button><h1 style="margin-top:12px">${EM[p.category]||'🍴'} ${esc(p.name)}</h1><div>${rv?.length?`<span class="stars">${stars(avg)}</span> <small>${avg.toFixed(1)} (${rv.length} مراجعة)</small>`:'<small>كن أول من يقيّم</small>'}</div><p class="mu">${esc(p.address||'بغداد')}</p><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">افتح بالخريطة</a>
 <label>أضف مراجعتك</label><div class="rate" id="rate"></div><textarea id="rt" rows="3" maxlength="1000" placeholder="شلون كانت تجربتك؟"></textarea><button class="btn" id="send">انشر المراجعة</button>
 <div style="margin-top:18px">${(rv||[]).map(v=>`<div class="rev"><b>${esc(v.profiles?.display_name||'مستخدم')}</b> <span class="stars">${stars(v.rating)}</span><p>${esc(v.body)}</p></div>`).join('')}</div>`;
 $('#back').onclick=renderDiscover;rateWidget($('#rate'),v=>rating=v);
 $('#send').onclick=async()=>{
  if(!user)return login('in');
  if(!rating){toast('اختار عدد النجوم');return}
  const {error}=await sb.from('reviews').upsert({user_id:user.id,place_id:id,rating,body:$('#rt').value.trim()},{onConflict:'user_id,place_id'});
  if(error){toast('تعذر النشر');return}
  toast('تم نشر المراجعة');detail(id)};
}

/* post */
function renderPost(){
 const b=$('#pBody');
 if(!user){b.innerHTML='<h1>انشر ريل</h1><p class="mu">تحتاج حساب حتى تنشر.</p><button class="btn" id="lg">سجّل دخول</button>';$('#lg').onclick=()=>login('in');return}
 let rating=0;
 b.innerHTML=`<h1>انشر ريل</h1><label>المكان</label><input id="ps" placeholder="ابحث عن اسم المطعم"><select id="pl" size="4"></select>
 <label>فيديو أو صورة (حتى 50 ميغا)</label><input type="file" id="fl" accept="video/*,image/*"><label>تقييمك (اختياري)</label><div class="rate" id="rate"></div>
 <label>الوصف</label><textarea id="cp" rows="3" maxlength="500" placeholder="اكتب شي عن التجربة"></textarea><button class="btn" id="pub">انشر</button>`;
 rateWidget($('#rate'),v=>rating=v);
 $('#ps').oninput=debounce(async e=>{
  const t=e.target.value.trim();if(t.length<2)return;
  const {data}=await sb.from('places').select('id,name,address').ilike('name','%'+t.replace(/[%,]/g,' ')+'%').limit(20);
  $('#pl').innerHTML=(data||[]).map(p=>`<option value="${p.id}">${esc(p.name)} - ${esc(p.address||'')}</option>`).join('')});
 $('#pub').onclick=async()=>{
  const f=$('#fl').files[0],pid=$('#pl').value;
  if(!pid||!f){toast('اختر المكان وارفع ملف');return}
  if(f.size>52428800){toast('الملف أكبر من 50 ميغا');return}
  const btn=$('#pub');btn.disabled=true;btn.textContent='جاري الرفع…';
  const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${user.id}/${Date.now()}.${ext}`;
  const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});
  if(up.error){toast('فشل الرفع: '+up.error.message);btn.disabled=false;btn.textContent='انشر';return}
  const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  const ins=await sb.from('reels').insert({user_id:user.id,place_id:pid,caption:$('#cp').value.trim(),media_url:url});
  if(ins.error){toast('تعذر النشر: '+ins.error.message);btn.disabled=false;btn.textContent='انشر';return}
  if(rating)await sb.from('reviews').upsert({user_id:user.id,place_id:pid,rating,body:$('#cp').value.trim()},{onConflict:'user_id,place_id'});
  toast('تم النشر');show('reels')};
}

/* me */
function renderMe(){
 $('#mBody').innerHTML=`<h1>حسابي</h1>${user?`<p><b>${esc(uname(user))}</b></p><p class="mu" dir="ltr" style="text-align:right">${esc(user.email)}</p><button class="btn ghost" id="lo">تسجيل الخروج</button>`:`<p class="mu">سجّل دخولك لتنشر وتعلّق وتقيّم.</p><button class="btn" id="li">دخول</button><button class="btn ghost" id="su">حساب جديد</button>`}
 <p style="margin-top:28px"><a href="mailto:bnc20255@gmail.com?subject=إعلان في لقمة">للإعلان في لقمة: bnc20255@gmail.com</a></p><p class="mu"><small>بيانات الأماكن © مساهمو OpenStreetMap</small></p>`;
 if(user)$('#lo').onclick=()=>sb.auth.signOut();else{$('#li').onclick=()=>login('in');$('#su').onclick=()=>login('up')}
}

function show(v){
 tab=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 if(v==='reels')loadReels();if(v==='discover')renderDiscover();if(v==='post')renderPost();if(v==='me')renderMe();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
loadReels();
</script></body></html>
